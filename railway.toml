[build]
builder = "nixpacks"
# install/build/start phases live in nixpacks.toml so we can override the
# default whole-monorepo install (which pulls CLI's better-sqlite3 and fails).
watchPatterns = ["packages/api/**", "packages/shared/**", "nixpacks.toml"]

[deploy]
# run db migrations once before the new version serves traffic; a failed
# migration aborts the deploy and keeps the previous version live.
preDeployCommand = "node packages/api/dist/migrate.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
healthcheckPath = "/health"
healthcheckTimeout = 30
